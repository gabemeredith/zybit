<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AcmeBank — Open an account</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="/fake-sites/acmebank/">Home</a>
        <a href="/fake-sites/acmebank/pricing">Pricing</a>
        <a href="/fake-sites/acmebank/signup">Open Account</a>
      </nav>
    </header>
    <main>
      <h1>Open an account</h1>
      <form>
        <label>Email <input type="email" name="email" required /></label>
        <label>Full legal name <input type="text" name="name" required /></label>
        <label>Date of birth <input type="date" name="dob" required /></label>
        <label>SSN <input type="text" name="ssn" required /></label>
        <label>Address <input type="text" name="addr" required /></label>
        <label>City <input type="text" name="city" required /></label>
        <label>State <input type="text" name="state" required /></label>
        <label>Zip <input type="text" name="zip" required /></label>
        <button data-testid="signup-cta" type="submit">Submit application</button>
      </form>
    </main>
  </body>
</html>
